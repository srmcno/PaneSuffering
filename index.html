<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070a12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Pane &amp; Suffering — a darkly comic window-washing survival game. Climb the Vandermeer Tower, keep the rig level, and try not to become part of the pavement."
    />
    <title>Pane &amp; Suffering</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #070a12;
        overflow: hidden;
        font-family: Inter, 'Segoe UI', Roboto, system-ui, sans-serif;
        /* The game owns every gesture: no pull-to-refresh, no double-tap zoom. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #app {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      #app canvas {
        display: block;
        /* Sell the CRT-free, crisp letterbox: a faint edge and a soft bloom. */
        box-shadow: 0 0 0 1px #1b2233, 0 24px 90px rgba(0, 0, 0, 0.75);
      }

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: #070a12;
        color: #8e9bb3;
        letter-spacing: 0.34em;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        transition: opacity 500ms ease;
        z-index: 10;
      }

      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }

      #boot .mark {
        width: 96px;
        height: 4px;
        background: repeating-linear-gradient(
          -45deg,
          #f6b73c 0 10px,
          #10131c 10px 20px
        );
      }

      #boot .bar {
        width: 180px;
        height: 2px;
        background: #1b2233;
        overflow: hidden;
      }

      #boot .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #f6b73c;
        animation: sweep 1.15s ease-in-out infinite;
      }

      @keyframes sweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(360%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot .bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <div class="mark"></div>
      <div>Pane &amp; Suffering</div>
      <div class="bar"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Wait for the boot scene to finish baking textures, not merely for a
      // canvas to exist — Phaser creates the canvas long before it draws.
      const boot = document.getElementById('boot');
      let done = false;
      const dismiss = () => {
        if (done) return;
        done = true;
        boot.classList.add('gone');
        setTimeout(() => boot.remove(), 600);
      };
      window.addEventListener('pane:ready', dismiss, { once: true });
      // Safety net: never trap the player behind the splash.
      setTimeout(dismiss, 12000);
    </script>
  </body>
</html>
